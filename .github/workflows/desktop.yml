name: desktop

# Builds the desktop app for macOS, Windows and Linux.
# A tag like v0.1.0 makes a draft release with the builds attached; publish it from the
# Releases page. Running the workflow by hand only uploads the builds as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-intel }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and attach to a draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Shrewd Studio ${{ github.ref_name }}
          releaseBody: Unsigned builds. See the README for how to open them the first time.
          releaseDraft: true

      - name: Build
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: shrewd-studio-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
